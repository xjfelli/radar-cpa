<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src blob:; child-src blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Previsão de dias de pouco movimento no almoço do Centro Político Administrativo de Cuiabá: pontos facultativos, recessos e dispensas dos órgãos públicos.">
  <title>Radar CPA · Restaurantes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff3b30' opacity='.25'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff3b30'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="mapa" class="mapa" role="region" aria-label="Mapa dos órgãos do Centro Político Administrativo"></div>

  <header class="topo">
    <div class="cartao material">
      <div class="cabecalho">
        <h1>Radar CPA <span>Restaurantes</span></h1>
        <p class="atualizado" id="atualizado">Carregando…</p>
      </div>
      <section class="resumo" id="resumo" aria-live="polite">
        <span class="resumo-ponto" aria-hidden="true"></span>
        <div class="resumo-textos">
          <strong id="resumo-titulo">Buscando a previsão…</strong>
          <span id="resumo-detalhe"></span>
        </div>
        <div class="medidor" aria-hidden="true"><span id="medidor-barra"></span></div>
      </section>
    </div>
    <nav class="dias material" id="dias" role="tablist" aria-label="Dias úteis"></nav>
  </header>

  <aside class="folha material" id="folha" aria-label="Órgãos e notícias">
    <button class="recentrar material" id="recentrar" type="button" aria-label="Mostrar todos os órgãos no mapa">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a1 1 0 0 1 1 1v1.55A7.5 7.5 0 0 1 18.95 11h1.55a1 1 0 1 1 0 2h-1.55A7.5 7.5 0 0 1 13 18.95v1.55a1 1 0 1 1-2 0v-1.55A7.5 7.5 0 0 1 5.05 13H3.5a1 1 0 1 1 0-2h1.55A7.5 7.5 0 0 1 11 5.05V3.5a1 1 0 0 1 1-1Zm0 4.5a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
    </button>
    <div class="alca-area" id="alca-area">
      <button class="alca" id="alca" type="button" aria-label="Expandir lista" aria-expanded="false"><span></span></button>
    </div>
    <div class="folha-conteudo" id="folha-conteudo" data-rola-quando-cheia>
      <section id="painel-lista" class="painel"></section>
      <section id="painel-detalhe" class="painel" hidden></section>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
          integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
