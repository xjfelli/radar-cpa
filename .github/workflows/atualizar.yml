name: Atualizar radar

on:
  schedule:
    # Cuiabá = UTC-4 (sem horário de verão): 05h, 08h, 11h, 14h, 17h, 20h e 22h locais.
    # Minuto 17 para fugir do pico de agendamentos na hora cheia.
    - cron: "17 9,12,15,18,21,0,2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Testes
        run: |
          python -m unittest discover -s tests -t .
          node --test tests/*.test.mjs

      - name: Coletar fontes e montar status
        run: python -m radar.coletar

      - name: Gravar status no repositório
        # Commitar a cada execução também mantém o agendamento vivo
        # (o GitHub desliga cron de repositórios sem atividade por 60 dias).
        run: |
          git config user.name "radar-cpa[bot]"
          git config user.email "radar-cpa@users.noreply.github.com"
          git add dados/status.json
          git diff --cached --quiet || git commit -m "chore: atualiza status $(TZ=America/Cuiaba date +%FT%H:%M)"
          # Outra execução (ou um push manual) pode ter avançado a main desde o checkout.
          # Rebase sobre o remoto; em conflito no status.json vence a coleta desta execução.
          for tentativa in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Montar site
        run: |
          mkdir _site
          cp -R index.html assets dados _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
